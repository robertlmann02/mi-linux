# MI Linux live session display-manager defaults.
# The live ISO should boot straight into the Debian live user so users can
# test hardware and launch the installer without needing credentials.
# Force Xorg for the live session because GDM/Wayland autologin can time out
# under QEMU/KVM and some graphics stacks before reaching the desktop.

[daemon]
WaylandEnable=false
AutomaticLoginEnable=True
AutomaticLogin=user
TimedLoginEnable=True
TimedLogin=user
TimedLoginDelay=1

[security]

[xdmcp]

[chooser]

[debug]
