# MI Linux live session display-manager defaults.
# The live ISO should boot straight into the Debian live user so users can
# test hardware and launch the installer without needing credentials.

[daemon]
AutomaticLoginEnable=true
AutomaticLogin=user
TimedLoginEnable=true
TimedLogin=user
TimedLoginDelay=0

[security]

[xdmcp]

[chooser]

[debug]
