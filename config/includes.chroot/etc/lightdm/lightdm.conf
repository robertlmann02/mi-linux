# MI Linux live session display-manager defaults.
# LightDM is used on the live ISO because it handles Debian live autologin
# reliably in QEMU/KVM and on physical hardware.

[LightDM]
run-directory=/run/lightdm

[Seat:*]
greeter-session=slick-greeter
# Use the explicit MI Linux Xsession wrapper so LightDM does not fall back to
# a generic/default session that can return immediately to the greeter.
user-session=mi-linux-gnome
allow-guest=false
autologin-user=user
autologin-user-timeout=0
autologin-session=mi-linux-gnome
session-wrapper=/etc/X11/Xsession
