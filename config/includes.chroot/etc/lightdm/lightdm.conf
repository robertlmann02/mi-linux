# MI Linux live session display-manager defaults.
# LightDM is used on the live ISO because it handles Debian live autologin
# reliably in QEMU/KVM and on physical hardware.

[LightDM]
run-directory=/run/lightdm

[Seat:*]
greeter-session=slick-greeter
# Debian GNOME live-build currently provides lightdm-xsession.desktop as the
# available X session in this image. Point LightDM at that exact session name;
# using "gnome" can return to the greeter after login/launch attempts.
user-session=lightdm-xsession
allow-guest=false
autologin-user=user
autologin-user-timeout=0
autologin-session=lightdm-xsession
session-wrapper=/etc/X11/Xsession
