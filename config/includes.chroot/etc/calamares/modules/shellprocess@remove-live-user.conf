---
dontChroot: false
timeout: 30
script:
  - command: "if getent passwd milinux | grep -q 'MI Linux'; then userdel -r milinux 2>/dev/null || userdel milinux 2>/dev/null || true; fi; rm -f /etc/sudoers.d/90-mi-linux-live-session /var/lib/AccountsService/users/milinux /home/milinux/.dmrc; for conf in /etc/gdm3/daemon.conf /etc/gdm3/custom.conf; do if [ -f \"$conf\" ]; then sed -i -E '/^(AutomaticLoginEnable|AutomaticLogin|TimedLoginEnable|TimedLogin|TimedLoginDelay)=/d' \"$conf\"; fi; done"
    timeout: 30
