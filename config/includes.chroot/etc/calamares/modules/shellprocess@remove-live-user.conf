---
dontChroot: false
timeout: 30
script:
  - command: "if getent passwd user | grep -q 'MI Linux Live User'; then userdel -r user 2>/dev/null || userdel user 2>/dev/null || true; fi; rm -f /etc/sudoers.d/90-mi-linux-live-user /var/lib/AccountsService/users/user /home/user/.dmrc; for conf in /etc/gdm3/daemon.conf /etc/gdm3/custom.conf; do if [ -f \"$conf\" ]; then sed -i -E '/^(AutomaticLoginEnable|AutomaticLogin|TimedLoginEnable|TimedLogin|TimedLoginDelay)=/d' \"$conf\"; fi; done"
    timeout: 30
